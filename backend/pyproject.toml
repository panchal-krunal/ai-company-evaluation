[project]
name = "company-evaluation-api"
version = "0.1.0"
description = "Company Evaluation Platform - FastAPI backend, financial engine, RAG research and background worker"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.107",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "voyageai>=0.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.107",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults
    "E501",   # line length is enforced by the formatter; long prompt strings are fine
    "RUF001", # "×" is used deliberately in user-facing text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "voyageai.*", "arq.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
