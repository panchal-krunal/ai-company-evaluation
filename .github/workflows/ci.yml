name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env: { POSTGRES_USER: evaluation, POSTGRES_PASSWORD: evaluation, POSTGRES_DB: evaluation }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U evaluation" --health-interval 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://evaluation:evaluation@localhost:5432/evaluation
      TEST_DATABASE_URL: postgresql+asyncpg://evaluation:evaluation@localhost:5432/evaluation
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: frontend/.nvmrc, cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
